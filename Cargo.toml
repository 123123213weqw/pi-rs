[package]
name = "pi"
version = "0.74.2"
edition = "2021"
description = "Rust port of the pi coding agent (parity with @earendil-works/pi-coding-agent 0.74.2 headless core)"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
